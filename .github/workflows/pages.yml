name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'electron/**'
      - 'assets/icons/**'
      - 'src/assets/icons/**'
      - 'forge.config.cjs'
      - 'vite.main.config.mjs'
      - 'vite.renderer.config.mjs'
      - 'scripts/desktop-smoke.mjs'
      - 'scripts/generate-macos-icons.sh'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

# Finish an active deployment; retain only the latest pending run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      manifest: ${{ steps.provenance.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test
      - name: Check React TypeScript
        run: npm run typecheck
      - name: Run ESLint
        run: npm run lint
      - name: Build production website
        run: npm run build
      - name: Record source commit and asset hashes
        id: provenance
        run: node scripts/build-provenance.mjs web
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify live commit and served assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_WEB_BUILD_INFO: ${{ needs.build.outputs.manifest }}
        run: node scripts/build-provenance.mjs verify-web
